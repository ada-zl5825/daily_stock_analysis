name: Family maintenance checks

on:
  push:
    branches: ["family/**"]
    paths:
      - "scripts/family_*.py"
      - "tests/test_family_ops.py"
      - "tests/test_docker_entrypoint.py"
      - "docker/Dockerfile"
      - "docker/entrypoint.sh"
      - "docker/family-compose.yml"
      - ".github/workflows/family-maintenance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m py_compile scripts/family_ops.py scripts/family_mac.py
      - run: python -m unittest discover -s tests -p test_family_ops.py -v
      - run: python -m pip install pytest PyYAML
      - run: python -m pytest --noconftest tests/test_docker_entrypoint.py -q
